<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>토모랑 백오피스 — 신청 현황</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="styles.css?v=3">
<style>
  body{background:var(--sky)}
  .adm{width:min(1280px,100%);margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:20px}
  .adm-head{display:flex;align-items:center;justify-content:space-between;gap:12px 24px;flex-wrap:wrap}
  .adm-head .brand b{font-size:22px}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .sbtn{min-height:40px;padding:8px 14px;border:0;cursor:pointer;background:#fff;color:var(--ink);font:inherit;font-size:14px;font-weight:700;box-shadow:0 -2px 0 var(--ink),0 2px 0 var(--ink),-2px 0 0 var(--ink),2px 0 0 var(--ink);margin:2px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .sbtn:hover{background:var(--bg)}.sbtn.pink{background:var(--pink)}.sbtn.lime{background:var(--lime)}.sbtn:disabled{opacity:.6;cursor:default}
  .status{font-size:13px;line-height:1.6}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
  .kpi{background:#fff;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
  .kpi b{font-family:var(--fp);font-weight:400;font-size:32px;line-height:1.1}
  .kpi span{font-size:13px}
  .kpi.pink{background:var(--pink)}.kpi.lime{background:var(--lime)}
  .panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}
  .panel-body{padding:16px;display:flex;flex-direction:column;gap:10px}
  .bar{display:grid;grid-template-columns:minmax(90px,auto) 1fr auto;gap:10px;align-items:center;font-size:14px}
  .bar .track{height:14px;background:#EEF7FF;box-shadow:0 0 0 2px var(--ink);position:relative}
  .bar .track i{position:absolute;left:0;top:0;bottom:0;background:var(--purple);display:block}
  .bar .track i.lime{background:var(--lime)}.bar .track i.pink{background:var(--pink)}
  .bar b{font-family:var(--fm);font-weight:400;min-width:28px;text-align:right}
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 16px;border-bottom:2px solid var(--sky)}
  .filters .inp{min-height:40px;width:auto;flex:1 1 200px;font-size:14px}
  .seg{display:flex;flex-wrap:wrap;gap:8px}
  .tbl-wrap{overflow:auto;max-height:70vh}
  table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;min-width:880px}
  th,td{border-bottom:1px solid #D7E6F2;padding:8px 10px;text-align:left;vertical-align:top;white-space:nowrap}
  th{background:var(--bg);position:sticky;top:0;font-family:var(--fm);font-weight:400;font-size:12px;z-index:1}
  td.wrap-cell{white-space:normal;min-width:180px}
  tr:hover td{background:#F7FBFF}
  .pill{display:inline-block;padding:2px 8px;font-size:12px;font-weight:700;background:var(--bg);margin:1px 2px 1px 0}
  .pill.ko{background:var(--pink)}.pill.ja{background:var(--lime)}
  .del{min-width:30px;height:28px;border:0;background:#fff;color:#B0247E;font-size:12px;font-weight:700;padding:0 8px;cursor:pointer;box-shadow:0 0 0 2px #D7E6F2}
  .del.armed{background:#FFE3EE;box-shadow:0 0 0 2px #B0247E}
  .gate{width:min(460px,100%);margin:60px auto}
  .gate .panel-body{gap:14px}
  .guide ol{margin:0;padding-left:20px;line-height:1.8;font-size:14px}
  code{background:var(--bg);padding:1px 6px;font-size:12px}
  .muted{opacity:.75}
  .log{font-size:12px;line-height:1.7;max-height:260px;overflow:auto}
  .log div{display:grid;grid-template-columns:150px 110px 1fr;gap:8px;border-bottom:1px solid #EEF4F8;padding:2px 0}
  @media (max-width:767px){.adm{padding:16px 12px 48px}.kpi b{font-size:26px}}
</style>
</head>
<body>
<div class="adm" id="app"></div>
<script src="config.js?v=3"></script>
<script src="admin.js?v=1"></script>
</body>
</html>
